<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EngineersTrackpad - ECE Strategic Matrix</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-primary: #38bdf8;
            --accent-success: #34d399;
            --accent-warning: #fb7185;
            --border-color: #334155;
            
            --state-tostart: #94a3b8;
            --state-inprogress: #38bdf8;
            --state-completed: #34d399;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 2rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.05em;
        }

        h1 span {
            color: var(--accent-primary);
        }

        .subtitle {
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        .header-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .stats-badge {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid var(--accent-primary);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.875rem;
            color: var(--accent-primary);
            font-weight: 600;
        }

        .sync-btn {
            background: #475569;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.875rem;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .sync-btn:hover { opacity: 0.9; }

        /* Filter Controls */
        .filter-container {
            margin-bottom: 1.5rem;
            display: flex;
            gap: 0.5rem;
        }

        .filter-btn {
            background: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            border-color: #475569;
            color: var(--text-main);
        }

        .filter-btn.active {
            background: var(--accent-primary);
            color: var(--bg-color);
            border-color: var(--accent-primary);
        }

        /* Layout Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-horizon {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-weight: 700;
        }

        .horizon-daily { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
        .horizon-weekly { background: rgba(168, 85, 247, 0.15); color: #c084fc; }
        .horizon-monthly { background: rgba(244, 63, 94, 0.15); color: #fb7185; }
        .horizon-semester { background: rgba(234, 179, 8, 0.15); color: #facc15; }

        .todo-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            flex-grow: 1;
        }

        .todo-item {
            background: rgba(15, 23, 42, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
            position: relative;
        }

        .todo-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1.5rem;
        }

        .todo-text {
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.1rem;
            line-height: 1;
            padding: 0 0.25rem;
            transition: color 0.2s;
        }

        .delete-btn:hover { color: var(--accent-warning); }

        .task-link-badge {
            align-self: flex-start;
            font-size: 0.8rem;
            color: var(--accent-primary);
            text-decoration: none;
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            transition: all 0.2s;
        }

        .task-link-badge:hover {
            background: rgba(56, 189, 248, 0.18);
            border-color: var(--accent-primary);
        }

        .todo-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            margin-top: 0.25rem;
            border-top: 1px dashed rgba(51, 65, 85, 0.5);
            padding-top: 0.5rem;
        }

        .todo-deadline { color: var(--text-muted); }

        .state-selector {
            background: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 0.15rem 0.4rem;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }

        .state-tostart { border-left: 3px solid var(--state-tostart); }
        .state-inprogress { border-left: 3px solid var(--state-inprogress); color: var(--accent-primary); }
        .state-completed { border-left: 3px solid var(--state-completed); color: var(--accent-success); }

        .progress-bar-container {
            background: var(--border-color);
            height: 6px;
            border-radius: 3px;
            margin-top: 1.25rem;
            overflow: hidden;
        }

        .progress-bar {
            background: var(--accent-success);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }

        /* Form Layout Board */
        .custom-input-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            border-radius: 12px;
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 1rem;
            margin-top: 1rem;
        }

        .input-row-full {
            grid-column: span 3;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 1rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            width: 100%;
        }

        .input-group label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 700;
        }

        .custom-input-box input, .custom-input-box select, .custom-input-box button {
            padding: 0.75rem 1rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-main);
            font-size: 0.95rem;
            width: 100%;
        }

        .custom-input-box button {
            background: var(--accent-primary);
            color: var(--bg-color);
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
            height: 44px;
            align-self: flex-end;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .custom-input-box button:hover { opacity: 0.9; }

        @media (max-width: 768px) {
            body { padding: 1rem; }
            .custom-input-box { grid-template-columns: 1fr; }
            .input-row-full { grid-template-columns: 1fr; grid-column: span 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div>
                <h1>Engineers<span>Trackpad</span></h1>
                <div class="subtitle">ECE Strategy Matrix & Persistent Local Storage Engine</div>
            </div>
            <div class="header-controls">
                <button class="sync-btn" onclick="linkDeviceKey()">⚙️ Data Options</button>
                <div class="stats-badge" id="global-progress">Completion: 0%</div>
            </div>
        </header>

        <!-- Global Filters Across Execution States -->
        <div class="filter-container">
            <button class="filter-btn active" onclick="setGlobalFilter('all')">All Matrix View</button>
            <button class="filter-btn" onclick="setGlobalFilter('tostart')">To Start</button>
            <button class="filter-btn" onclick="setGlobalFilter('inprogress')">In Progress</button>
            <button class="filter-btn" onclick="setGlobalFilter('completed')">Completed</button>
        </div>

        <!-- Dashboard Matrices -->
        <main class="grid" id="dashboard-grid">
            <!-- Populated dynamically by JS engine -->
        </main>

        <!-- Input Generation Board -->
        <div class="custom-input-box">
            <div class="input-group">
                <label for="goal-text">Milestone Description</label>
                <input type="text" id="goal-text" placeholder="e.g., Run layout verification checking top-silk rules...">
            </div>
            <div class="input-group">
                <label for="goal-horizon">Horizon Vector</label>
                <select id="goal-horizon">
                    <option value="daily">Daily Grind</option>
                    <option value="weekly">Weekly Sprint</option>
                    <option value="monthly">Monthly Milestone</option>
                    <option value="semester">Semester Strategy</option>
                </select>
            </div>
            <div class="input-group">
                <label for="goal-deadline">Deadline Constraint</label>
                <input type="datetime-local" id="goal-deadline">
            </div>
            
            <div class="input-row-full">
                <div class="input-group">
                    <label for="goal-link-label">Link Text / Platform</label>
                    <input type="text" id="goal-link-label" placeholder="e.g., EasyEDA Schematic, GitHub Repo">
                </div>
                <div class="input-group">
                    <label for="goal-link-url">Resource URL Connection</label>
                    <input type="url" id="goal-link-url" placeholder="https://example.com/project-deep-dive">
                </div>
            </div>
            
            <div class="input-group" style="grid-column: span 3; justify-self: end; width: 200px; margin-top: 0.5rem;">
                <button onclick="addNewGoal()">Inject Goal</button>
            </div>
        </div>
    </div>

    <script>
        // Data Structure Layer: Instant Local Caching Configuration
        let currentFilter = 'all';
        let goals = [];

        // Fallback default engineering seed milestones
        const defaultSeedGoals = [
            { id: 1, horizon: 'daily', text: '30 mins structural C/Python codebase logic exercises', state: 'inprogress', deadline: null, notified: false, linkLabel: 'GitHub', linkUrl: 'https://github.com' },
            { id: 2, horizon: 'weekly', text: 'Execute NPTEL / BS Course week assignment targets', state: 'inprogress', deadline: null, notified: false, linkLabel: 'NPTEL Portal', linkUrl: 'https://nptel.ac.in' },
            { id: 3, horizon: 'weekly', text: 'Isolate circuit bugs inside simulation runs', state: 'tostart', deadline: null, notified: false, linkLabel: 'Tinkercad Circuits', linkUrl: 'https://tinkercad.com' }
        ];

        const horizons = {
            daily: { title: 'Daily Grind', class: 'horizon-daily' },
            weekly: { title: 'Weekly Sprint', class: 'horizon-weekly' },
            monthly: { title: 'Monthly Milestone', class: 'horizon-monthly' },
            semester: { title: 'Semester Strategy', class: 'horizon-semester' }
        };

        document.addEventListener('DOMContentLoaded', () => {
            requestNotificationPermission();
            
            // CRITICAL HARD BACKUP LOAD: Pulls instantly from local storage cache on refresh
            const storedBackup = localStorage.getItem('engineers_trackpad_local_backup');
            if (storedBackup) {
                try {
                    goals = JSON.parse(storedBackup);
                } catch (e) {
                    goals = defaultSeedGoals;
                }
            } else {
                goals = defaultSeedGoals;
                localStorage.setItem('engineers_trackpad_local_backup', JSON.stringify(goals));
            }
            
            // Build visual matrices instantly
            renderDashboard();
            initializeNotificationClocks();
        });

        function requestNotificationPermission() {
            if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
                Notification.requestPermission();
            }
        }

        // State Engine Execution Pipeline: Updates screen & local disk array concurrently
        function saveState() {
            localStorage.setItem('engineers_trackpad_local_backup', JSON.stringify(goals));
            renderDashboard();
        }

        function setGlobalFilter(filterValue) {
            currentFilter = filterValue;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if (event && event.target) {
                event.target.classList.add('active');
            }
            renderDashboard();
        }

        function renderDashboard() {
            const grid = document.getElementById('dashboard-grid');
            if (!grid) return;
            grid.innerHTML = '';

            Object.keys(horizons).forEach(key => {
                const horizonAllGoals = goals.filter(g => g.horizon === key);
                const totalCount = horizonAllGoals.length;
                const completedCount = horizonAllGoals.filter(g => g.state === 'completed').length;
                const progressPercent = totalCount ? Math.round((completedCount / totalCount) * 100) : 0;

                const visibleGoals = horizonAllGoals.filter(g => {
                    if (currentFilter === 'all') return true;
                    return g.state === currentFilter;
                });

                const card = document.createElement('div');
                card.className = 'card';
                
                let cardHtml = `
                    <div class="card-title">
                        <span>${horizons[key].title}</span>
                        <span class="card-horizon ${horizons[key].class}">${key}</span>
                    </div>
                    <ul class="todo-list">
                `;

                visibleGoals.forEach(goal => {
                    const formattedDeadline = goal.deadline ? new Date(goal.deadline).toLocaleString([], {month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit'}) : 'No Deadline';
                    
                    let targetLinkHtml = '';
                    if (goal.linkUrl && goal.linkUrl.trim() !== '') {
                        const anchorText = goal.linkLabel && goal.linkLabel.trim() !== '' ? goal.linkLabel : 'Launch Link';
                        targetLinkHtml = `<a href="${goal.linkUrl}" target="_blank" class="task-link-badge">🔗 ${anchorText}</a>`;
                    }

                    cardHtml += `
                        <li class="todo-item">
                            <div class="todo-header">
                                <span class="todo-text">${goal.text}</span>
                                <button class="delete-btn" onclick="deleteGoal(${goal.id})">&times;</button>
                            </div>
                            
                            ${targetLinkHtml}
                            
                            <div class="todo-meta">
                                <span class="todo-deadline">${formattedDeadline}</span>
                                <select class="state-selector state-${goal.state}" onchange="updateGoalState(${goal.id}, this.value)">
                                    <option value="tostart" ${goal.state === 'tostart' ? 'selected' : ''}>To Start</option>
                                    <option value="inprogress" ${goal.state === 'inprogress' ? 'selected' : ''}>In Progress</option>
                                    <option value="completed" ${goal.state === 'completed' ? 'selected' : ''}>Completed</option>
                                </select>
                            </div>
                        </li>
                    `;
                });

                cardHtml += `
                    </ul>
                    <div class="progress-bar-container">
                        <div class="progress-bar" style="width: ${progressPercent}%"></div>
                    </div>
                `;

                card.innerHTML = cardHtml;
                grid.appendChild(card);
            });

            updateGlobalProgressDisplay();
        }

        function updateGoalState(id, newState) {
            const goal = goals.find(g => g.id === id);
            if (goal) {
                goal.state = newState;
                saveState();
            }
        }

        function addNewGoal() {
            const textInput = document.getElementById('goal-text');
            const horizonSelect = document.getElementById('goal-horizon');
            const deadlineInput = document.getElementById('goal-deadline');
            const linkLabelInput = document.getElementById('goal-link-label');
            const linkUrlInput = document.getElementById('goal-link-url');
            
            if (!textInput || textInput.value.trim() === '') return;

            const newGoal = {
                id: Date.now(),
                horizon: horizonSelect.value,
                text: textInput.value.trim(),
                state: 'tostart',
                deadline: deadlineInput.value ? new Date(deadlineInput.value).getTime() : null,
                notified: false,
                linkLabel: linkLabelInput.value.trim(),
                linkUrl: linkUrlInput.value.trim()
            };

            goals.push(newGoal);
            
            textInput.value = '';
            deadlineInput.value = '';
            linkLabelInput.value = '';
            linkUrlInput.value = '';
            
            saveState();
        }

        function deleteGoal(id) {
            const targetGoal = goals.find(g => g.id === id);
            const taskDescription = targetGoal ? targetGoal.text : "this milestone";
            
            if (confirm(`Are you sure you want to permanently delete:\n"${taskDescription}"?`)) {
                goals = goals.filter(g => g.id !== id);
                saveState();
            }
        }

        function updateGlobalProgressDisplay() {
            const total = goals.length;
            const completed = goals.filter(g => g.state === 'completed').length;
            const globalPercent = total ? Math.round((completed / total) * 100) : 0;
            const badge = document.getElementById('global-progress');
            if (badge) {
                badge.innerText = `Completion: ${globalPercent}% (Saved Local Engine)`;
            }
        }

        // Cross-Device Sync Matrix Exporter Tools
        function linkDeviceKey() {
            const actionType = prompt("MANAGE TRACKPAD DATA STATE\nType 'EXPORT' to copy your database sync text code string.\nType 'IMPORT' to replace current list elements with an external sync key string:");
            
            if (!actionType) return;
            
            if (actionType.toUpperCase() === 'EXPORT') {
                const encodedData = btoa(encodeURIComponent(JSON.stringify(goals)));
                prompt("Copy this sync key string to paste onto your secondary device profile:", encodedData);
            } else if (actionType.toUpperCase() === 'IMPORT') {
                const importString = prompt("Paste your task sync key string here:");
                if (importString && importString.trim() !== '') {
                    try {
                        const decryptedData = JSON.parse(decodeURIComponent(atob(importString.trim())));
                        if (Array.isArray(decryptedData)) {
                            goals = decryptedData;
                            saveState();
                            alert("Data matrices synced and saved successfully!");
                        }
                    } catch (e) {
                        alert("Malformed dashboard payload string validation check failed.");
                    }
                }
            }
        }

        function triggerSystemNotification(title, message) {
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification(title, { body: message });
            }
        }

        function initializeNotificationClocks() {
            // Calendar deadline checker loop (10s intervals)
            setInterval(() => {
                const now = Date.now();
                let stateMutated = false;
                goals.forEach(goal => {
                    if (goal.deadline && goal.state !== 'completed' && !goal.notified && now >= goal.deadline) {
                        triggerSystemNotification(`Deadline Breached!`, `Target execution missed for: "${goal.text}"`);
                        goal.notified = true;
                        stateMutated = true;
                    }
                });
                if (stateMutated) saveState();
            }, 10000);

            // Micro-Interval Task Loop: 2-Hour alerts for 'Daily Grind' vectors in progress
            setInterval(() => {
                const activeDailyTasks = goals.filter(g => g.horizon === 'daily' && g.state === 'inprogress');
                if (activeDailyTasks.length > 0) {
                    triggerSystemNotification(`Daily Grind Checkpoint`, `You have ${activeDailyTasks.length} active tasks open. Keep up your execution streak!`);
                }
            }, 7200000);
        }
    </script>
</body>
</html>
