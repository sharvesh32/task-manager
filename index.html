<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EngineersTrackpad - Authenticated Matrix</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-primary: #38bdf8;
            --accent-success: #34d399;
            --accent-warning: #fb7185;
            --border-color: #334155;
            
            --state-tostart: #94a3b8;
            --state-inprogress: #38bdf8;
            --state-completed: #34d399;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 2rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Auth Screen Styling */
        #auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 1rem;
        }

        .auth-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 2.5rem;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .auth-card h2 {
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
            letter-spacing: -0.03em;
        }

        .auth-card h2 span { color: var(--accent-primary); }

        .auth-subtitle {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-bottom: 2rem;
        }

        /* Main Dashboard Structuring */
        header {
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.05em;
        }

        h1 span { color: var(--accent-primary); }

        .subtitle {
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        .header-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .stats-badge {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid var(--accent-primary);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.875rem;
            color: var(--accent-primary);
            font-weight: 600;
        }

        .logout-btn {
            background: rgba(253, 113, 133, 0.1);
            border: 1px solid var(--accent-warning);
            color: var(--accent-warning);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.875rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: var(--accent-warning);
            color: var(--bg-color);
        }

        /* Filter Controls */
        .filter-container {
            margin-bottom: 1.5rem;
            display: flex;
            gap: 0.5rem;
        }

        .filter-btn {
            background: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .filter-btn:hover { border-color: #475569; color: var(--text-main); }
        .filter-btn.active {
            background: var(--accent-primary);
            color: var(--bg-color);
            border-color: var(--accent-primary);
        }

        /* Grid Framework */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-horizon {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-weight: 700;
        }

        .horizon-daily { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
        .horizon-weekly { background: rgba(168, 85, 247, 0.15); color: #c084fc; }
        .horizon-monthly { background: rgba(244, 63, 94, 0.15); color: #fb7185; }
        .horizon-semester { background: rgba(234, 179, 8, 0.15); color: #facc15; }

        .todo-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            flex-grow: 1;
        }

        .todo-item {
            background: rgba(15, 23, 42, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
            position: relative;
        }

        .todo-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1.5rem;
        }

        .todo-text { font-size: 0.95rem; line-height: 1.4; }

        .delete-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.1rem;
            line-height: 1;
            padding: 0 0.25rem;
            transition: color 0.2s;
        }

        .delete-btn:hover { color: var(--accent-warning); }

        .task-link-badge {
            align-self: flex-start;
            font-size: 0.8rem;
            color: var(--accent-primary);
            text-decoration: none;
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            transition: all 0.2s;
        }

        .task-link-badge:hover {
            background: rgba(56, 189, 248, 0.18);
            border-color: var(--accent-primary);
        }

        .todo-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            margin-top: 0.25rem;
            border-top: 1px dashed rgba(51, 65, 85, 0.5);
            padding-top: 0.5rem;
        }

        .todo-deadline { color: var(--text-muted); }

        .state-selector {
            background: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 0.15rem 0.4rem;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }

        .state-tostart { border-left: 3px solid var(--state-tostart); }
        .state-inprogress { border-left: 3px solid var(--state-inprogress); color: var(--accent-primary); }
        .state-completed { border-left: 3px solid var(--state-completed); color: var(--accent-success); }

        .progress-bar-container {
            background: var(--border-color);
            height: 6px;
            border-radius: 3px;
            margin-top: 1.25rem;
            overflow: hidden;
        }

        .progress-bar {
            background: var(--accent-success);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }

        /* Input Form Container */
        .custom-input-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            border-radius: 12px;
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 1rem;
            margin-top: 1rem;
        }

        .input-row-full {
            grid-column: span 3;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 1rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            width: 100%;
        }

        .input-group label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 700;
        }

        input, select, button {
            padding: 0.75rem 1rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-main);
            font-size: 0.95rem;
            width: 100%;
            outline: none;
        }

        input:focus, select:focus { border-color: var(--accent-primary); }

        button {
            background: var(--accent-primary);
            color: var(--bg-color);
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }

        .input-group button {
            height: 44px;
            align-self: flex-end;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 768px) {
            body { padding: 1rem; }
            .custom-input-box { grid-template-columns: 1fr; }
            .input-row-full { grid-template-columns: 1fr; grid-column: span 1; }
        }
    </style>
</head>
<body>

    <!-- Access Gateway Security Layer -->
    <div id="auth-overlay">
        <div class="auth-card">
            <h2>Engineers<span>Trackpad</span></h2>
            <div class="auth-subtitle">Sync milestones using security keys</div>
            
            <div class="input-group" style="margin-bottom: 1rem;">
                <label for="auth-id">Login ID</label>
                <input type="text" id="auth-id" placeholder="e.g., sharvesh32">
            </div>
            
            <div class="input-group" style="margin-bottom: 1.5rem;">
                <label for="auth-pass">Passkey Secret</label>
                <input type="password" id="auth-pass" placeholder="••••••••">
            </div>
            
            <button onclick="authenticateProfile()" id="auth-submit-btn">Unlock Secure Workspace</button>
        </div>
    </div>

    <!-- Active Dashboard Workspace Layout -->
    <div class="container">
        <header>
            <div>
                <h1>Engineers<span>Trackpad</span></h1>
                <div class="subtitle" id="user-display-heading">Secure Matrix Active</div>
            </div>
            <div class="header-controls">
                <button class="logout-btn" onclick="lockProfileWorkspace()">Lock Account</button>
                <div class="stats-badge" id="global-progress">Syncing Database...</div>
            </div>
        </header>

        <div class="filter-container">
            <button class="filter-btn active" onclick="setGlobalFilter(event, 'all')">All Matrix View</button>
            <button class="filter-btn" onclick="setGlobalFilter(event, 'tostart')">To Start</button>
            <button class="filter-btn" onclick="setGlobalFilter(event, 'inprogress')">In Progress</button>
            <button class="filter-btn" onclick="setGlobalFilter(event, 'completed')">Completed</button>
        </div>

        <main class="grid" id="dashboard-grid">
            <!-- Rendered dynamically by engine elements -->
        </main>

        <div class="custom-input-box">
            <div class="input-group">
                <label for="goal-text">Milestone Description</label>
                <input type="text" id="goal-text" placeholder="e.g., Run layout verification checking top-silk rules...">
            </div>
            <div class="input-group">
                <label for="goal-horizon">Horizon Vector</label>
                <select id="goal-horizon">
                    <option value="daily">Daily Grind</option>
                    <option value="weekly">Weekly Sprint</option>
                    <option value="monthly">Monthly Milestone</option>
                    <option value="semester">Semester Strategy</option>
                </select>
            </div>
            <div class="input-group">
                <label for="goal-deadline">Deadline Constraint</label>
                <input type="datetime-local" id="goal-deadline">
            </div>
            
            <div class="input-row-full">
                <div class="input-group">
                    <label for="goal-link-label">Link Text / Platform</label>
                    <input type="text" id="goal-link-label" placeholder="e.g., EasyEDA Schematic, GitHub Repo">
                </div>
                <div class="input-group">
                    <label for="goal-link-url">Resource URL Connection</label>
                    <input type="url" id="goal-link-url" placeholder="https://example.com/project-deep-dive">
                </div>
            </div>
            
            <div class="input-group" style="grid-column: span 3; justify-self: end; width: 200px; margin-top: 0.5rem;">
                <button onclick="addNewGoal()">Inject Goal</button>
            </div>
        </div>
    </div>

    <script>
        let currentFilter = 'all';
        let goals = [];
        let secureUserToken = localStorage.getItem('active_auth_token') || '';
        let secureUserDisplay = localStorage.getItem('active_auth_display') || '';

        const horizons = {
            daily: { title: 'Daily Grind', class: 'horizon-daily' },
            weekly: { title: 'Weekly Sprint', class: 'horizon-weekly' },
            monthly: { title: 'Monthly Milestone', class: 'horizon-monthly' },
            semester: { title: 'Semester Strategy', class: 'horizon-semester' }
        };

        document.addEventListener('DOMContentLoaded', () => {
            requestNotificationPermission();
            
            // Auto-bypass login frame if persistent authentication key token is detected
            if (secureUserToken) {
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('user-display-heading').innerText = `Workspace Matrix: ${secureUserDisplay}`;
                loadCloudState();
            }
            initializeNotificationClocks();
        });

        function requestNotificationPermission() {
            if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
                Notification.requestPermission();
            }
        }

        // Authentication Broker Layer (Generates unique bucket locations deterministically)
        function authenticateProfile() {
            const userIdInput = document.getElementById('auth-id').value.trim().toLowerCase();
            const passwordInput = document.getElementById('auth-pass').value.trim();
            const authButton = document.getElementById('auth-submit-btn');

            if (!userIdInput || !passwordInput) {
                alert("Please declare both Login ID and Passkey Secret configurations.");
                return;
            }

            authButton.innerText = "Connecting Crypto Storage...";
            authButton.disabled = true;

            // Generate a secure string tracking hash without bulky library additions
            const deterministicSalt = userIdInput + "_" + passwordInput;
            let finalHash = 0;
            for (let i = 0; i < deterministicSalt.length; i++) {
                finalHash = (finalHash << 5) - finalHash + deterministicSalt.charCodeAt(i);
                finalHash |= 0;
            }
            const secureUniqueBucketId = "box_" + Math.abs(finalHash);

            // Establish session keys lock parameters
            localStorage.setItem('active_auth_token', secureUniqueBucketId);
            localStorage.setItem('active_auth_display', userIdInput);
            secureUserToken = secureUniqueBucketId;
            secureUserDisplay = userIdInput;

            // Hide authorization view panel blocks
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('user-display-heading').innerText = `Workspace Matrix: ${userIdInput}`;

            // Pull profile assets from server stack
            loadCloudState();
        }

        function lockProfileWorkspace() {
            if(confirm("Confirm security lockout on this terminal profile?")) {
                localStorage.removeItem('active_auth_token');
                localStorage.removeItem('active_auth_display');
                location.reload();
            }
        }

        // Database Sync Pipelines (Using optimized JSON payload routing pipes)
        async function loadCloudState() {
            if (!secureUserToken) return;
            try {
                const response = await fetch(`https://kvdb.io/MN74pD4V9xLq2Z267y42Zz/${secureUserToken}`);
                if (response.ok) {
                    const cloudGoalsData = await response.json();
                    if (Array.isArray(cloudGoalsData)) {
                        goals = cloudGoalsData;
                        renderDashboard();
                        updateProgressUI(true);
                        return;
                    }
                }
                // Seed blank states if this login ID is completely new
                goals = [];
                saveCloudState();
            } catch (error) {
                console.warn("Database storage engine routing delay:", error);
                updateProgressUI(false);
            }
        }

        async function saveCloudState() {
            renderDashboard();
            if (!secureUserToken) return;
            try {
                const response = await fetch(`https://kvdb.io/MN74pD4V9xLq2Z267y42Zz/${secureUserToken}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(goals)
                });
                if(response.ok) updateProgressUI(true);
            } catch (error) {
                console.error("Cloud array write rejected:", error);
                updateProgressUI(false);
            }
        }

        function updateProgressUI(networkOnline) {
            const total = goals.length;
            const completed = goals.filter(g => g.state === 'completed').length;
            const pct = total ? Math.round((completed / total) * 100) : 0;
            const badge = document.getElementById('global-progress');
            if(badge) {
                badge.innerText = `Completion: ${pct}% ${networkOnline ? '(Secure Cloud)' : '(Network Delayed)'}`;
                badge.style.borderColor = networkOnline ? 'var(--accent-success)' : 'var(--accent-warning)';
            }
        }

        function setGlobalFilter(e, filterValue) {
            currentFilter = filterValue;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if (e && e.target) e.target.classList.add('active');
            renderDashboard();
        }

        function renderDashboard() {
            const grid = document.getElementById('dashboard-grid');
            if (!grid) return;
            grid.innerHTML = '';

            Object.keys(horizons).forEach(key => {
                const horizonAllGoals = goals.filter(g => g.horizon === key);
                const totalCount = horizonAllGoals.length;
                const completedCount = horizonAllGoals.filter(g => g.state === 'completed').length;
                const progressPercent = totalCount ? Math.round((completedCount / totalCount) * 100) : 0;

                const visibleGoals = horizonAllGoals.filter(g => {
                    if (currentFilter === 'all') return true;
                    return g.state === currentFilter;
                });

                const card = document.createElement('div');
                card.className = 'card';
                
                let cardHtml = `
                    <div class="card-title">
                        <span>${horizons[key].title}</span>
                        <span class="card-horizon ${horizons[key].class}">${key}</span>
                    </div>
                    <ul class="todo-list">
                `;

                visibleGoals.forEach(goal => {
                    const formattedDeadline = goal.deadline ? new Date(goal.deadline).toLocaleString([], {month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit'}) : 'No Deadline';
                    
                    let targetLinkHtml = '';
                    if (goal.linkUrl && goal.linkUrl.trim() !== '') {
                        const anchorText = goal.linkLabel && goal.linkLabel.trim() !== '' ? goal.linkLabel : 'Open Link';
                        targetLinkHtml = `<a href="${goal.linkUrl}" target="_blank" class="task-link-badge">🔗 ${anchorText}</a>`;
                    }

                    cardHtml += `
                        <li class="todo-item">
                            <div class="todo-header">
                                <span class="todo-text">${goal.text}</span>
                                <button class="delete-btn" onclick="deleteGoal(${goal.id})">&times;</button>
                            </div>
                            
                            ${targetLinkHtml}
                            
                            <div class="todo-meta">
                                <span class="todo-deadline">${formattedDeadline}</span>
                                <select class="state-selector state-${goal.state}" onchange="updateGoalState(${goal.id}, this.value)">
                                    <option value="tostart" ${goal.state === 'tostart' ? 'selected' : ''}>To Start</option>
                                    <option value="inprogress" ${goal.state === 'inprogress' ? 'selected' : ''}>In Progress</option>
                                    <option value="completed" ${goal.state === 'completed' ? 'selected' : ''}>Completed</option>
                                </select>
                            </div>
                        </li>
                    `;
                });

                cardHtml += `
                    </ul>
                    <div class="progress-bar-container">
                        <div class="progress-bar" style="width: ${progressPercent}%"></div>
                    </div>
                `;

                card.innerHTML = cardHtml;
                grid.appendChild(card);
            });
        }

        function updateGoalState(id, newState) {
            const goal = goals.find(g => g.id === id);
            if (goal) {
                goal.state = newState;
                saveCloudState();
            }
        }

        function addNewGoal() {
            const textInput = document.getElementById('goal-text');
            const horizonSelect = document.getElementById('goal-horizon');
            const deadlineInput = document.getElementById('goal-deadline');
            const linkLabelInput = document.getElementById('goal-link-label');
            const linkUrlInput = document.getElementById('goal-link-url');
            
            if (!textInput || textInput.value.trim() === '') return;

            const newGoal = {
                id: Date.now(),
                horizon: horizonSelect.value,
                text: textInput.value.trim(),
                state: 'tostart',
                deadline: deadlineInput.value ? new Date(deadlineInput.value).getTime() : null,
                notified: false,
                linkLabel: linkLabelInput.value.trim(),
                linkUrl: linkUrlInput.value.trim()
            };

            goals.push(newGoal);
            
            textInput.value = '';
            deadlineInput.value = '';
            linkLabelInput.value = '';
            linkUrlInput.value = '';
            
            saveCloudState();
        }

        function deleteGoal(id) {
            const targetGoal = goals.find(g => g.id === id);
            const taskDescription = targetGoal ? targetGoal.text : "this milestone";
            
            if (confirm(`Are you sure you want to permanently delete:\n"${taskDescription}"?`)) {
                goals = goals.filter(g => g.id !== id);
                saveCloudState();
            }
        }

        function triggerSystemNotification(title, message) {
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification(title, { body: message });
            }
        }

        function initializeNotificationClocks() {
            setInterval(() => {
                const now = Date.now();
                let stateMutated = false;
                goals.forEach(goal => {
                    if (goal.deadline && goal.state !== 'completed' && !goal.notified && now >= goal.deadline) {
                        triggerSystemNotification(`Deadline Breached!`, `Target execution missed for: "${goal.text}"`);
                        goal.notified = true;
                        stateMutated = true;
                    }
                });
                if (stateMutated) saveCloudState();
            }, 10000);

            setInterval(() => {
                const activeDailyTasks = goals.filter(g => g.horizon === 'daily' && g.state === 'inprogress');
                if (activeDailyTasks.length > 0) {
                    triggerSystemNotification(`Daily Grind Checkpoint`, `You have ${activeDailyTasks.length} active tasks open. Keep up your execution streak!`);
                }
            }, 7200000);
        }
    </script>
</body>
</html>
